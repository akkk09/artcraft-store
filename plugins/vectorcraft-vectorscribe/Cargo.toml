[package]
name = "vectorcraft-vectorscribe"
version = "1.0.0"
edition = "2021"
description = "VectorScribe path, node and handle editing toolkit for VectorCraft"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
