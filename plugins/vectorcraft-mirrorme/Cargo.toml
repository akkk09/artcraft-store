[package]
name = "vectorcraft-plugin-mirrorme"
version = "0.1.0"
edition = "2021"
description = "VectorCraft MirrorMe plugin: Real-time symmetry, axis reflection, and kaleidoscopic vector replication"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
