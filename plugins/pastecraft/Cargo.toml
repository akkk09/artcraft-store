[package]
name = "pastecraft"
version = "0.1.0"
edition = "2024"
description = "Universal clipboard asset importer, vector converter, and layer replacer for EffectCraft"
license = "MIT OR Apache-2.0"
authors = ["EffectCraft Contributors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "pastecraft-cli"
path = "src/main.rs"

[workspace]
