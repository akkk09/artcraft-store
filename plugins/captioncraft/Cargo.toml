[package]
name = "captioncraft"
version = "0.1.0"
edition = "2024"
description = "Original subtitle authoring, SRT/WebVTT processor, and caption tool for EffectCraft"
license = "MIT OR Apache-2.0"
authors = ["EffectCraft Contributors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "captioncraft-cli"
path = "src/main.rs"

[workspace]
