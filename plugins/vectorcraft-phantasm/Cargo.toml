[package]
name = "vectorcraft-plugin-phantasm"
version = "0.1.0"
edition = "2021"
description = "VectorCraft Phantasm plugin: Curves, Levels, Hue/Saturation, Exposure, and Tonal adjustments for vector artwork"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
