[package]
name = "citron"
version = "1.0.0"
edition = "2024"
description = "Citron: Maya/Blender-inspired multi-channel graph editor, FFD lattice cage tool, and curve engine for EffectCraft"
license = "MIT OR Apache-2.0"
authors = ["EffectCraft Contributors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "citron-cli"
path = "src/main.rs"

[workspace]
