[package]
name = "lumasweep"
description = "LumaSweep: Advanced controllable light sweep effect with bevel edge response, chromatic fringe, procedural texture, and luminance relief for EffectCraft"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone workspace so it can target both wasm32-unknown-unknown cdylib and native host cli.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lumasweep-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
