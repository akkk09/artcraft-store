[package]
name = "quietcraft"
version = "0.1.0"
edition = "2024"
description = "Original automated silence-cutting, derush, and audio timeline trimmer for EffectCraft"
license = "MIT OR Apache-2.0"
authors = ["EffectCraft Contributors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "quietcraft-cli"
path = "src/main.rs"

[workspace]
