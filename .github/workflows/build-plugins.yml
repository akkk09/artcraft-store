name: Build plug-ins
on:
  pull_request:
    paths:
      - "plugins/**"
      - "assets/**"
      - "scripts/**"
      - "web-ui/**"
      - "catalog.json"
      - "build-all.sh"
      - ".github/workflows/build-plugins.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "plugins/**"
      - "assets/**"
      - "scripts/**"
      - "web-ui/**"
      - "catalog.json"
      - "build-all.sh"
      - ".github/workflows/build-plugins.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null
      - name: Check download audit scripts compile
        run: python -m py_compile scripts/validate_catalog.py scripts/check_live_downloads.py
      - name: Check egui WebAssembly storefront
        run: cargo check --manifest-path web-ui/Cargo.toml --target wasm32-unknown-unknown
      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: latest
      - name: Build egui WebAssembly frontend
        run: trunk build --release --public-url /artcraft-store/ --dist ../web-dist
        working-directory: web-ui
      - name: Test Gradient Map algorithms
        run: cargo test --manifest-path plugins/gradient-map/Cargo.toml
      - name: Test Color Toolkit algorithms
        run: cargo test --manifest-path plugins/color-toolkit/Cargo.toml
      - name: Test Detail Recovery algorithms
        run: cargo test --manifest-path plugins/detail-recovery/Cargo.toml
      - name: Test Film Emulation algorithms
        run: cargo test --manifest-path plugins/film-emulation/Cargo.toml
      - name: Test Mosaic Pixelate algorithms
        run: cargo test --manifest-path plugins/mosaic-pixelate/Cargo.toml
      - name: Test Vignette algorithms
        run: cargo test --manifest-path plugins/vignette/Cargo.toml
      - name: Test White Balance algorithms
        run: cargo test --manifest-path plugins/white-balance/Cargo.toml
      - name: Test LUT Studio parser and interpolation
        run: cargo test --manifest-path plugins/lut-studio/Cargo.toml
      - name: Test Geometry Fixer transform algorithms
        run: cargo test --manifest-path plugins/geometry-fixer/Cargo.toml
      - name: Test Seamless Pattern Generator algorithms
        run: cargo test --manifest-path plugins/seamless-pattern-generator/Cargo.toml
      - name: Test LumaSweep algorithms
        run: cargo test --manifest-path plugins/lumasweep/Cargo.toml
      - name: Test Glassify algorithms
        run: cargo test --manifest-path plugins/glassify/Cargo.toml
      - name: Test PivotCraft algorithms
        run: cargo test --manifest-path plugins/pivotcraft/Cargo.toml
      - name: Test Citron algorithms
        run: cargo test --manifest-path plugins/citron/Cargo.toml
      - name: Test PasteCraft algorithms
        run: cargo test --manifest-path plugins/pastecraft/Cargo.toml
      - name: Build and stage plug-ins
        run: bash build-all.sh
      - name: Audit catalog downloads and release assets
        run: python scripts/validate_catalog.py --check-artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artcraft-store-plugins
          path: dist/*
          if-no-files-found: error
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/photocraft_plugin_smudge_blend.wasm
            dist/photocraft_plugin_mixer_blend.wasm
            dist/photocraft_plugin_gradient_map.wasm
            dist/photocraft_plugin_color_toolkit.wasm
            dist/photocraft_plugin_detail_recovery.wasm
            dist/photocraft_plugin_film_emulation.wasm
            dist/photocraft_plugin_mosaic_pixelate.wasm
            dist/photocraft_plugin_vignette.wasm
            dist/photocraft_plugin_white_balance.wasm
            dist/photocraft_plugin_lut_studio.wasm
            dist/photocraft_plugin_geometry_fixer.wasm
            dist/photocraft_plugin_seamless_pattern_generator.wasm
            dist/filmcraft-film-emulation-toolkit.zip
            dist/creator-graphics-pack.zip
            dist/chromatic-fringe.wat
            dist/depthcraft.wasm
            dist/lumasweep.wasm
            dist/glassify.wasm
            dist/EaseCraft.jsx
            dist/CaptionCraft.jsx
            dist/QuietCraft.jsx
            dist/PivotCraft.jsx
            dist/Citron.jsx
            dist/PasteCraft.jsx
            dist/vectorcraft_plugin_recolor.wasm
            dist/soundcraft-audio-toolkit.zip
            dist/pdfcraft-invoice-calculator.js
