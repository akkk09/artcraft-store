name: Deploy plugin store website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "catalog.json"
      - "plugins/**"
      - "build-all.sh"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build plug-ins
        run: bash build-all.sh
      - name: Prepare downloadable extensions
        run: |
          mkdir -p downloads
          cp dist/* downloads/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
