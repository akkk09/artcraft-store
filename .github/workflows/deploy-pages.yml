name: Deploy plugin store website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "web-ui/**"
      - "catalog.json"
      - "api/v1/**"
      - "plugins/**"
      - "assets/**"
      - "scripts/**"
      - "build-all.sh"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/build-plugins.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate catalog JSON
        run: python -m json.tool catalog.json > /dev/null
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build plug-ins
        run: bash build-all.sh
      - name: Audit catalog downloads and release assets
        run: python scripts/validate_catalog.py --check-artifacts
      - name: Build egui WebAssembly storefront
        run: trunk build --release --public-url /artcraft-store/ --dist ../web-dist
        working-directory: web-ui
      - name: Assemble Pages site
        run: |
          mkdir -p web-dist/downloads
          cp dist/* web-dist/downloads/
          cp catalog.json favicon.svg web-dist/
          cp -r api lut-studio web-dist/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Audit deployed download URLs
        env:
          PAGE_URL: \${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_live_downloads.py --base-url "$PAGE_URL"
